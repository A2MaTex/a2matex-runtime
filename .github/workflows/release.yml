name: Release Runtime

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l cmd internal pkg)"
      - run: go test ./...

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            executable: a2matex-runtime
          - os: windows-latest
            platform: windows-x64
            executable: a2matex-runtime.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build native Runtime
        shell: bash
        env:
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse HEAD)"
          build_time="$(git show -s --format=%cI HEAD)"
          mkdir -p dist
          ldflags="-X github.com/A2MaTex/a2matex-runtime/internal/buildinfo.Version=$version -X github.com/A2MaTex/a2matex-runtime/internal/buildinfo.Commit=$commit -X github.com/A2MaTex/a2matex-runtime/internal/buildinfo.BuildTime=$build_time"
          go build -buildvcs=false -ldflags "$ldflags" -o "dist/$EXECUTABLE" ./cmd/agent
          "dist/$EXECUTABLE" --help
      - name: Archive Linux Runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -C dist -czf "dist/a2matex-runtime-$version-linux-x64.tar.gz" a2matex-runtime
      - name: Archive Windows Runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -LiteralPath dist/a2matex-runtime.exe -DestinationPath "dist/a2matex-runtime-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/a2matex-runtime-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish immutable Runtime artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag
